# mise.toml del plugin trinity — runtime del SERVIZIO Hindsight (server MCP :8888).
#
# Questo file NON è caricato automaticamente da Claude Code né da mise nei progetti:
# viene usato esplicitamente dagli hook del plugin via `mise -C <plugin_root> run <task>`
# (vedi hooks/hindsight/hindsight-ensure-up.sh). Hindsight è un singleton di macchina:
# l'env qui sotto serve SOLO al processo server al momento del lancio, i progetti
# parlano con il server già configurato via HTTP.
#
# La dashboard log (Roda/Puma), i benchmark (embed-bench/rerank-bench) e i check
# aggiornamenti (api-check/cp-check, in scheduler/) sono stati migrati
# qui dal repo Trinity. I task relativi sono in fondo a questo file.

[tools]
python = "3.13"
# Node nativo Windows: serve per il Control Plane di Hindsight (app Next.js avviata
# via `npx @vectorize-io/hindsight-control-plane`). NB: l'npx del Node MSYS2 UCRT64
# (/ucrt64/bin) crasha (segfault/bad_weak_ptr) — questo Node mise lo rimpiazza.
node = "lts"
# Ruby per la dashboard log (Roda/Puma): `bundle install` e `puma` girano con questo
# Ruby gestito da mise, NON quello MSYS2 (le gem vanno installate con lo stesso Ruby
# che le esegue). L'hook reshim richiede `mise` nel PATH — garantito da _.path in [env].
ruby = "4.0.1"

[env]
# Espone gli entry-point script di hindsight-api (hindsight-local-mcp, hindsight-api, ecc.)
# La Scripts dir del Python mise non e' nel PATH per default sotto MSYS2.
_.path = [
  "{{ get_env(name='HOME', default='') }}/.local/share/mise/installs/python/3.13.13/Scripts",
]

# Forza Python a usare UTF-8 per stdin/stdout/stderr. Hindsight stampa un banner
# ANSI con caratteri Unicode che crasha sotto cp1252 (default Windows non-EN).
PYTHONUTF8 = "1"

# Bundle CA via DUE dotenv in ordine (le chiavi [env] inline batterebbero _.file, quindi
# NON si usano per i cert): default.env sulla chiavetta (bundle Mozilla completo, sempre
# presente) + proxy.env aziendale (solo sui PC dietro il proxy MITM ENINET, lo sovrascrive
# perche' viene DOPO). mise ignora un _.file mancante senza errori, quindi a casa (niente
# proxy.env) resta il default. Serve perche' alcuni PC hanno un SSL_CERT_FILE globale Windows
# a un bundle incompleto → CERTIFICATE_VERIFY_FAILED su ZeroEntropy/LiteLLM/Node.
_.file = ["{{ get_env(name='HOME', default='') }}/certs/default.env", "C:/certs/proxy.env"]

# Provider LLM per le operazioni retain/recall/reflect di hindsight.
HINDSIGHT_API_LLM_PROVIDER = "openai"
HINDSIGHT_API_LLM_MODEL = "gpt-4.1-mini"
# La chiave viene risolta a runtime dall'env utente (OPENAI_API_KEY), non hardcodata qui.
# default(''): il fail-fast sulla chiave mancante NON può stare qui. Questo blocco [env]
# mise lo valuta prima di OGNI comando, quindi senza default il template rompe anche
# `mise install`, `stop-hindsight`, `db-dump`, `cp-check` — che con OpenAI non c'entrano —
# e il bootstrap Linux, che gira PRIMA che le chiavi siano impostate (SETUP-LINUX.md §2
# vs §3). La validazione è in [tasks.start-hindsight], l'unico task che usa davvero il LLM.
HINDSIGHT_API_LLM_API_KEY = "{{ env.OPENAI_API_KEY | default(value='') }}"
# Salta la chiamata di verifica LLM al boot (2026-06-12): avvio più rapido per
# hindsight-ensure-up.sh a inizio sessione, e niente hang se il proxy ENINET fa MITM.
# Contro accettato: una OPENAI_API_KEY errata emerge al primo retain, non al boot.
HINDSIGHT_API_SKIP_LLM_VERIFICATION = "true"

# --- LLM dedicato alla CONSOLIDATION (generazione delle observation) ---------
# A/B 3-vie del 2026-06-02 su seed reale (23 fatti, tag claude-code):
#   nano       → 0 observation: sul cold-start emette UPDATE su id inesistenti, mai CREATE
#   gpt-4.1-mini → 16 observation, con update incrementale corretto tra i batch
#   gpt-5-mini (reasoning, effort low) → 15 observation, qualità simile ma ~1.5-2x latenza
# Scelto gpt-4.1-mini. NB: la consolidation è server-level (no override per-bank);
# cambiarla richiede restart.
HINDSIGHT_API_CONSOLIDATION_LLM_PROVIDER = "openai"
HINDSIGHT_API_CONSOLIDATION_LLM_MODEL = "gpt-4.1-mini"
HINDSIGHT_API_CONSOLIDATION_LLM_API_KEY = "{{ env.OPENAI_API_KEY | default(value='') }}"
HINDSIGHT_API_CONSOLIDATION_LLM_TIMEOUT = "180"

# PRODUZIONE: gemini-embedding-001 (1536 dim) dal 2026-07-27, di nuovo dopo la parentesi
# zembed-1 (2026-05-27 → 2026-07-27), chiusa perche' ZeroEntropy spegne tutto il 2026-09-04.
# Scelto su benchmark vettoriale (bench_results/embed_20260727_000525.json, corpus ostico
# 61 doc / 23 query): gemini-001 MRR 0.978 = zembed-1 al suo massimo (2560 dim), contro
# voyage-4 0.914, text-embedding-3-large 0.895, jina-v3 0.853. Sulla singola query e' anche
# piu' rapido e stabile di zembed-1 (238ms mediana / 281ms peggiore, contro 362 / 546).
# Baseline di qualita' PRE-migrazione in bench_results/baseline-zembed1-20260727/.
# ⚠️ Solo zembed-1 e onnx implementano encode_query asimmetrico: con gemini la query passa
#    da encode() come i documenti. Non e' un problema (gemini e' simmetrico per costruzione),
#    ma spiega perche' zembed-1 usato senza asimmetria crolla a MRR 0.571.
# ⚠️ Usare un progetto Google con BILLING ATTIVO: sul free tier Google dichiara di usare i
#    contenuti inviati per addestrare i propri modelli; sul tier a pagamento no.
HINDSIGHT_API_EMBEDDINGS_PROVIDER = "google"
# default(''): non deve abortire il lancio del server se la chiave manca nell'ambiente.
HINDSIGHT_API_EMBEDDINGS_GEMINI_API_KEY = "{{ env.GEMINI_API_KEY | default(value='') }}"
# NB: gemini-embedding-2 esiste (il nome "gemini-embedding-002" da 404) e dal 2026-07-27 non
# rompe piu' il batching 1:1, ma resta peggiore: MRR 0.906 vs 0.978 e in modalita' batch
# serializza (17.5s per 61 doc contro 1.2s). Restare su 001.
HINDSIGHT_API_EMBEDDINGS_GEMINI_MODEL = "gemini-embedding-001"
HINDSIGHT_API_EMBEDDINGS_GEMINI_OUTPUT_DIMENSIONALITY = 1536

# Modelli locali multilingua (contenuti in italiano), usati solo se provider = local.
HINDSIGHT_API_EMBEDDINGS_LOCAL_MODEL = "BAAI/bge-m3"
HINDSIGHT_API_RERANKER_LOCAL_MODEL = "BAAI/bge-reranker-v2-m3"

# --- Lingua del canale lessicale BM25 (backend "native") --------------------
# I contenuti del bank sono in italiano: il dizionario tsvector di Postgres deve fare
# stemming/stopword italiane. Riguarda SOLO il canale BM25; il semantico è multilingua.
# ⚠️ Agisce solo sui NUOVI INSERT. Non impostiamo HINDSIGHT_API_LLM_OUTPUT_LANGUAGE:
# tradurrebbe i nomi entità e frammenterebbe il grafo (path, comandi, identificatori).
HINDSIGHT_API_TEXT_SEARCH_EXTENSION_NATIVE_LANGUAGE = "italian"

# --- Reranker Voyage via LiteLLM SDK (remoto, in-process) --------------------
# MIGRATO il 2026-07-26: ZeroEntropy e' stata acquisita da Notion e spegne tutto il
# 2026-09-04. 'litellm-sdk' usa la libreria litellm IN-PROCESS, NON richiede il proxy
# LiteLLM. Cambiare reranker NON richiede rebuild del bank (agisce a query-time).
#
# Scelto rerank-2.5 al posto di jina-reranker-v3 MALGRADO un MRR piu' basso (0.600 vs
# 0.700 su 15 query, bench_results_rerank/20260726-211857): Jina ordina un filo meglio
# ma non CALIBRA gli score, e qui servono anche per filtrare. Distribuzione misurata
# su 13 query del bank reale (forti / deboli / fuori dominio):
#   voyage/rerank-2.5      0.762-0.938   0.447-0.563   0.297-0.375   -> finestra 0.199
#   jina_ai/jina-reranker-v3  0.587-0.649   0.516-0.556   0.500-0.533   -> finestra 0.030
# Con Jina il taglio di recall_min_rerank_score andrebbe infilato in 3 centesimi, e la
# carbonara prende 0.50 contro lo 0.59 di una domanda vera. Soglie tarate su questa
# scala in hindsight.config.json: recall_min_rerank_score 0.60, recall_min_reranker 0.40.
# Rollback fino al 2026-09-04: provider "zeroentropy" + le due righe sotto.
#   HINDSIGHT_API_RERANKER_ZEROENTROPY_API_KEY = "{{ env.ZEROENTROPY_API_KEY | default(value='') }}"
#   HINDSIGHT_API_RERANKER_ZEROENTROPY_MODEL = "zerank-2"
HINDSIGHT_API_RERANKER_PROVIDER = "litellm-sdk"
HINDSIGHT_API_RERANKER_LITELLM_SDK_MODEL = "voyage/rerank-2.5"
HINDSIGHT_API_RERANKER_LITELLM_SDK_API_KEY = "{{ env.VOYAGE_API_KEY | default(value='') }}"
HINDSIGHT_API_RERANKER_LITELLM_SDK_TIMEOUT = "8"
# Gate del braccio semantico (default fabbrica 0.3). Alzato a 0.4 il 2026-06-12 sulla scala
# di zembed-1 (i vincenti stavano >= 0.47; il pool 0.33-0.45 non vinceva mai).
# RI-TARATO il 2026-07-27 per gemini-embedding-001, che ha una scala diversa e piu' compressa
# (18 query gold sul bank reale): gold migliore min 0.5439 / med 0.6623 / max 0.6940;
# tutti i rilevanti 0.5403-0.7120; NON rilevanti 0.5087-0.7304. Le due distribuzioni si
# sovrappongono: la cosine di gemini NON separa pertinente da rumore (lo fa il reranker).
# Sweep 0.0 / 0.50 / 0.55 / 0.60: MRR 0.7778 e 14/18 in prima posizione in TUTTI i casi,
# mentre i candidati semantici crollano (900 -> 900 -> 368 -> 43). Alzarla non migliora
# nulla e non fa risparmiare: il reranker riceve comunque il suo cap di 100 candidati.
# LASCIATA a 0.4 (= inerte, il peggior risultato che entra nel recall sta a 0.5087) perche'
# 0.55+ escluderebbe dal braccio semantico il gold piu' debole (q09, 0.5439), che oggi
# sopravvive solo grazie a BM25/graph: dipendenza fragile in cambio di zero guadagno.
HINDSIGHT_API_SEMANTIC_MIN_SIMILARITY = "0.4"
# Timeout zerank-2 sotto il recall_timeout(10s) dell'hook (2026-06-12, default 60):
# se ZeroEntropy si appende, il rerank fallisce in fretta e il recall ripiega
# sull'ordine RRF dentro il budget dell'hook, invece di lavorare per nessuno.
HINDSIGHT_API_RERANKER_ZEROENTROPY_TIMEOUT = "8"
# Cap dei candidati passati al reranker per recall (2026-06-12, default 300): meno
# payload/latenza/costo verso zerank-2. VALIDATO col benchmark gold (18 query, k=3):
# top-3 identici rank per rank a 300; unico costo un fatto gold che era in posizione
# 17 e sparisce dalla coda (found_any 15→14/18). Rivalutare se recall_max_results >= 10.
HINDSIGHT_API_RERANKER_MAX_CANDIDATES = "100"
# Cap per-budget (nativo 0.9.0: HINDSIGHT_API_RERANKER_MAX_CANDIDATES_LOW/MID/HIGH,
# default 0 = disattivo → fallback sul flat sopra). VALUTATO e lasciato SPENTO
# (2026-08-09, ICH-58). A/B con MID=40 sugli hook automatici (budget "mid"):
# fase rerank 0.60→0.46s ma mediana totale solo -0.1s (domina il retrieval, ~1.1s
# di cui graph 0.6-0.7s), e il bench gold peggiora: MRR 0.722→0.694, R@3
# 0.778→0.722, found_any 15→14/18. Un contesto peggiore costa un retry: il
# guadagno non ripaga. Pipeline deterministica (overlap run-su-run 100%), quindi
# il delta è reale. Rivalutare se il reranker torna locale o se il pool RRF
# (oggi ~1500-1700 candidati) cresce di molto.

# --- Recency decay del ranking (2026-07-03) ----------------------------------
# Curva di freshness nel recall: exponential con emivita 60g al posto della
# lineare a 365g. Con la lineare un fatto di 1 mese perde ~1.6 punti % di boost
# vs uno di oggi: i near-duplicate superati (es. script/ -> scripts/) pesano
# quasi quanto la versione fresca. Con exp-60: oggi +10%, 30g +4%, 60g neutro,
# 180g -7.5% (boost cappato a +-10%, alpha 0.2 fissa upstream). E' una spinta
# sui pari-merito, NON un fix dei fatti superati: quello resta l'igiene della
# memoria (invalidate/update). NB: config server-GLOBALE (non e' tra i campi
# bank-configurable: vale anche per core e obsidian); richiede restart server.
HINDSIGHT_API_RECENCY_DECAY_FUNCTION = "exponential"
HINDSIGHT_API_RECENCY_DECAY_HALFLIFE_DAYS = "60"

# --- Embedding zembed-1 ZeroEntropy (PRODUZIONE, nativo da hindsight-api 0.7.1) -------
# ⚠️ Cambiare provider IMPONE un REBUILD del bank: zembed-1 usa dim Matryoshka
#    [2560,1280,640,...], non 1536. Procedura: export (hindsight_export.py) → cambia
#    provider → riavvia → re-retain (hindsight_import.py). Tool in hooks/hindsight/tools/.
HINDSIGHT_API_EMBEDDINGS_ZEROENTROPY_API_KEY = "{{ env.ZEROENTROPY_API_KEY | default(value='') }}"
HINDSIGHT_API_EMBEDDINGS_ZEROENTROPY_MODEL = "zembed-1"
HINDSIGHT_API_EMBEDDINGS_ZEROENTROPY_DIMENSIONS = 1280 # Matryoshka: 2560/1280/640/320/160/80/40

# --- Audit log (2026-06-12) --------------------------------------------------
# Traccia ogni operazione (recall/retain/reflect/consolidation/…) nella tabella
# audit_log con duration_ms lato server, transport (http/mcp/system) e payload —
# copre TUTTI i client, anche quelli invisibili a hindsight-debug.log (tool MCP,
# promote script, Control Plane). Scrittura fire-and-forget (task asyncio fuori
# dal percorso richiesta): impatto performance trascurabile. Query: endpoint
# /audit-logs e /audit-logs/stats per bank.
HINDSIGHT_API_AUDIT_LOG_ENABLED = "true"
# Senza retention la tabella cresce per sempre (default -1): 30 giorni bastano
# per l'analisi dei timing; la pulizia la fa il MaintenanceLoop in background.
HINDSIGHT_API_AUDIT_LOG_RETENTION_DAYS = "30"

# --- Retain: errori di estrazione non silenziosi (2026-07-26, da 0.8.5) ------
# Senza questa, un retain in cui l'LLM fallisce su una parte dei fatti chiude
# comunque l'operation come "completed" (con extraction_errors_count > 0 sepolto
# nel result_metadata): le memorie mancano ma nulla lo segnala. Con true
# l'operation diventa "failed", quindi la intercetta hindsight-failcheck.sh, che
# interroga /operations?status=failed. Il dettaglio sta in
# result_metadata.extraction_errors_sample.
HINDSIGHT_API_FAIL_ON_EXTRACTION_ERRORS = "true"

[tasks.install-hindsight]
description = "Installa/aggiorna hindsight-api-slim (server Python locale, espone MCP) tramite pip del Python mise."
shell = "bash -c"
run = [
  # NON usare il meta-pacchetto "hindsight-api": e' un alias di hindsight-api-slim[all],
  # e [all] tira dentro l'extra local-ml (torch + stack CUDA + sentence-transformers +
  # mlx) per ~3,5 GB che qui non servono mai: embeddings e reranker sono su ZeroEntropy
  # (provider remoto, vedi HINDSIGHT_API_EMBEDDINGS_PROVIDER) e l'LLM e' OpenAI. Con
  # provider != "local" il server non importa nemmeno torch al boot. Serve solo l'extra
  # embedded-db (pg0-embedded) per il Postgres in ~/.pg0. Se un giorno si torna ai
  # modelli locali: reinstallare "hindsight-api-slim[all]".
  'python -m pip install --upgrade "hindsight-api-slim[embedded-db]"',
  # Il runtime python puo' essere appena cambiato (upgrade via mise): butta la cache
  # del path reale usata dagli hook (hs-python.sh). Il suo check -x non basta: un
  # upgrade installa il nuovo python ACCANTO al vecchio, che resta eseguibile, e la
  # cache continuerebbe a puntare all'interprete su cui pip NON ha appena installato.
  'rm -f "${XDG_CACHE_HOME:-$HOME/.cache}/trinity/hs-python-real.path"',
]

[tasks.start-hindsight]
description = "Avvia hindsight-local-mcp in background (porta 8888). Log in /tmp/hs.log."
# Mise su Windows usa cmd.exe per default — forziamo bash per via di `& disown` e `/tmp/`.
# --daemon non funziona su Windows (fork unavailable). setsid + nohup + disown:
#   - setsid: nuova sessione → child non riceve SIGHUP quando il terminale chiude
#   - nohup: extra sicurezza; < /dev/null: chiude stdin; & disown: fuori dal job control
# Senza setsid+nohup, su MSYS/Windows il child viene reaped quando il bash dell'hook esce.
shell = "bash -c"
# --host 127.0.0.1: il default del pacchetto è 0.0.0.0 e il server NON ha autenticazione.
# Se un giorno esponi oltre localhost (es. VPS), PRIMA abilita l'auth, altrimenti la
# memoria è leggibile/cancellabile da chiunque raggiunga la porta:
#   HINDSIGHT_API_TENANT_EXTENSION=hindsight_api.extensions.builtin.tenant:ApiKeyTenantExtension
#   HINDSIGHT_API_TENANT_API_KEY=<chiave>
# Nota: servono entrambe — la chiave da sola non attiva nulla. Poi ogni client (hook REST,
# shim MCP, Control Plane, dashboard) deve mandare "Authorization: Bearer <chiave>".
#
# Le guardie ${...:?} sono il fail-fast sulle chiavi: qui e non nel blocco [env] (vedi
# HINDSIGHT_API_LLM_API_KEY). OpenAI: SKIP_LLM_VERIFICATION=true salta il check al boot,
# senza guardia il server partirebbe con chiave vuota e il danno emergerebbe al primo
# retain. Gemini (provider embedding "google" dal 2026-07-27, al posto della guardia
# ZeroEntropy dell'era zembed-1): il server detached parte anche con chiave vuota
# (default('') sul template) e gli errori di embed finirebbero solo in /tmp/hs.log,
# mentre il task uscirebbe comunque con 0. VOYAGE_API_KEY resta senza guardia: senza
# chiave il recall degrada (niente rerank), non muore.
run = ': "${OPENAI_API_KEY:?manca la chiave: export OPENAI_API_KEY=sk-... (vedi docs/SETUP-LINUX.md sezione 3)}"; : "${GEMINI_API_KEY:?manca la chiave: export GEMINI_API_KEY=... (vedi docs/SETUP-LINUX.md sezione 3)}"; setsid nohup hindsight-local-mcp --host 127.0.0.1 --port 8888 --log-level info > /tmp/hs.log 2>&1 < /dev/null & disown'

[tasks.stop-hindsight]
description = "Ferma il server hindsight-local-mcp (+ python figlio) e il Postgres embedded del bank"
# Forziamo bash: lo script usa taskkill //T (path assoluto) e pg_ctl.
# Path relativo: mise esegue il task con cwd = config_root (= root del plugin).
# {{config_root}} darebbe backslash Windows che la bash spezzerebbe.
shell = "bash -c"
run = "bash hooks/hindsight/ops/hindsight-stop-services.sh"

# --- Sync del DB tra macchine (uso alternato, mai concorrente) ---------------
[tasks.db-dump]
description = "pg_dump del DB hindsight per il sync tra macchine (default: E:/var/backups/hindsight sulla chiavetta; Linux: ~/backups/hindsight)"
shell = "bash -c"
run = "bash hooks/hindsight/tools/hs-db-dump.sh"

[tasks.db-restore]
description = "Restore del DB hindsight dall'ultimo dump (guardrail anti-perdita; --force per forzare). Uso: mise run db-restore [-- file.dump] [-- --force]"
shell = "bash -c"
run = "bash hooks/hindsight/tools/hs-db-restore.sh"

# --- Control Plane (Web UI Hindsight) --------------------------------------
[tasks.control-plane]
description = "Avvia il Control Plane (Web UI Hindsight) su http://localhost:9999, collegato all'API :8888. Foreground: Ctrl-C per fermarlo."
# HOSTNAME=localhost: Next.js eredita la env HOSTNAME (sotto MSYS2 = nome macchina) e
# vi si legherebbe; forzata a localhost per non esporre la UI in LAN (bind su ::1).
# Workaround hostname (2026-06-12, verificato fino alla 0.9.0): il redirect-loop
# delle 0.7.0+ non è un bug i18n in sé ma un origin-mismatch di Next standalone
# (vercel/next.js#91844): NextURL normalizza 127.0.0.1→localhost nel rewrite del
# middleware next-intl, mentre initUrl del router usa l'hostname di bind → il
# rewrite interno viene trattato come esterno → proxy su se stesso → loop 307.
# Bind su "localhost" fa combaciare gli origin. NON tornare a --hostname 127.0.0.1:
# il loop riappare (e con bind localhost l'URL http://127.0.0.1:9999 non risponde).
shell = "bash -c"
run = "HOSTNAME=localhost npx --yes @vectorize-io/hindsight-control-plane --hostname localhost --api-url http://localhost:8888"

[tasks.stop-control-plane]
description = "Ferma il Control Plane (processo Node in ascolto su :9999)"
shell = "bash -c"
run = "bash hooks/hindsight/ops/kill-port.sh 9999 control-plane"

# --- Dashboard log (Roda/Puma) ---------------------------------------------
# Web app Ruby per analizzare hindsight-debug.log (JSONL): tail SSE realtime,
# color-coding, filtri, vista memories[]. Gira sul Ruby mise (4.0.1), non MSYS2.
# Il default del log in app.rb è portabile (<plugin_root>/logs/hindsight-debug.log),
# coerente con lib/hindsight_debug.py — quindi il task non passa LOG_FILE.
[tasks.install-dashboard]
description = "Installa le gem della dashboard log (bundle install) sotto il Ruby mise (4.0.1). Eseguire una tantum prima di `dashboard`."
shell = "bash -c"
run = "cd hooks/hindsight/hindsight-dashboard && bundle install"

[tasks.dashboard]
description = "Avvia la dashboard log Hindsight (Roda/Puma) su http://localhost:9292. Foreground: Ctrl-C per fermarla. Richiede prima `mise run install-dashboard`."
shell = "bash -c"
# -b invece di -p: senza host esplicito Puma ascolta su tutte le interfacce, e la
# dashboard non ha autenticazione — /api/events servirebbe alla LAN il debug log,
# che contiene i prompt e le memorie.
run = "cd hooks/hindsight/hindsight-dashboard && bundle exec puma -b tcp://127.0.0.1:9292"

[tasks.stop-dashboard]
description = "Ferma la dashboard log (processo Puma in ascolto su :9292)"
shell = "bash -c"
run = "bash hooks/hindsight/ops/kill-port.sh 9292 dashboard"

# --- Benchmark qualità (embedding / reranker) ------------------------------
# Ereditano l'[env] del plugin (provider + chiavi) → girano con la config di produzione.
# Script rilocabili (corpora via __dir__/__file__). hindsight_bench.rb (bench LLM provider)
# e hindsight_recall_quality_bench.py restano lanciabili a mano da hooks/hindsight/benchmark/.
[tasks.embed-bench]
description = "Confronta gli embedding (zembed-1 vs Gemini vs bge-m3 locale) a livello vettoriale puro su corpus sintetico IT/EN (MRR, recall@k). NON tocca il bank né Postgres. Foreground (~minuti, scarica bge-m3 al primo run)."
shell = "bash -c"
run = "python hooks/hindsight/benchmark/hindsight_embed_bench.py"

[tasks.rerank-bench]
description = "Confronta i reranker su corpus rank-aware (MRR, recall@k). Ferma/riavvia il server :8888 più volte e lo ripristina alla fine (~5-10 min). Eredita l'[env] di produzione."
shell = "bash -c"
run = "ruby hooks/hindsight/benchmark/hindsight_rerank_bench.rb"

# --- Check aggiornamenti (scheduler) ---------------------------------------
# Lanciabili a mano o da System Scheduler (Splinterware) via scheduler/*/*-scheduled.cmd
# (i job vanno registrati con i path di questo repo — vedi i README in scheduler/).
# cp-check.rb tiene lo stato (ultima release vista) in un file .state accanto
# allo script; api-check.rb legge la versione installata dal Python di mise.
[tasks.api-check]
description = "Controlla se su PyPI è uscita una versione di hindsight-api/hindsight-api-slim più recente di quella installata. Exit 10 se sì."
shell = "bash -c"
run = "ruby scheduler/check_update_hindsight_api/api-check.rb"

[tasks.cp-check]
description = "Segnala (una volta sola) una nuova release del Control Plane su npm; il task control-plane è sempre-latest via npx. Exit 10 se sì."
shell = "bash -c"
run = "ruby scheduler/check_update_hindsight_control_plane/cp-check.rb"

[tasks.nb-check]
description = "Controlla se su PyPI è uscita una versione di notebooklm-py più recente di quella installata in E:/AI/tools/notebooklm. Exit 10 se sì."
shell = "bash -c"
run = "ruby scheduler/check_update_notebooklm/nb-check.rb"

[tasks.yt-check]
description = "Controlla se su GitHub è uscita una versione del plugin yt-extract più recente di quella clonata in E:/AI/tools/claude-code-youtube-extract. Exit 10 se sì."
shell = "bash -c"
run = "ruby scheduler/check_update_yt_extract/yt-check.rb"

# --- Excalidraw Canvas (frontend MCP) -------------------------------------
[tasks.start-excalidraw]
description = "Avvia il frontend canvas Excalidraw (porta 3000). Log in logs/excalidraw-server.log."
shell = "bash -c"
run = "setsid nohup node $HOME/.local/opt/mcp_excalidraw/dist/server.js > /tmp/excalidraw-server.log 2>&1 < /dev/null & disown"

[tasks.stop-excalidraw]
description = "Ferma il frontend canvas Excalidraw (porta 3000), solo se il server su :3000 è effettivamente Excalidraw."
shell = "bash -c"
run = "ruby scripts/stop-excalidraw.rb"

[tasks.promote-scan]
description = "Scan + triage LLM dei bank Hindsight di progetto: candidati alla promozione sul core in logs/promote-candidates.json. NON promuove (review umana via /trinity:promote)."
shell = "bash -c"
run = "python hooks/hindsight/ops/hindsight-promote.py --triage"

# --- Sync settings utente Claude -------------------------------------------
# ~/.claude/settings.json e' generato da config/claude/settings.shared.json +
# overlay per OS (settings.windows.json / settings.linux.json). Flusso: modifica
# nel repo -> push/pull -> questo task su ogni macchina (su Linux lo lancia
# anche bootstrap-linux.sh, sezione 6). Backup .bak prima di scrivere.
[tasks.sync-settings]
description = "Rigenera ~/.claude/settings.json da config/claude/ (shared + overlay OS). Idempotente, backup .bak."
shell = "bash -c"
# cygpath: il Python mise su Windows e' nativo e non capisce i path MSYS di $HOME;
# su Linux cygpath non esiste e resta il path POSIX.
run = 'python scripts/setup/sync-claude-settings.py "$(cygpath -w "$HOME/.claude/settings.json" 2>/dev/null || echo "$HOME/.claude/settings.json")"'

# --- Git hooks -------------------------------------------------------------
# Attiva gli hook versionati in .githooks/ (non tracciati in .git/hooks/).
# Da rilanciare una volta per ogni clone nuovo del repo.
[tasks.install-git-hooks]
description = "Configura git per usare .githooks/ (post-commit/post-merge: ridistribuiscono la callback LiteLLM se scripts/litellm-callbacks.py cambia)."
shell = "bash -c"
run = "git config core.hooksPath .githooks && echo 'core.hooksPath = .githooks'"

# --- Release plugin --------------------------------------------------------
# Parte meccanica della release: bump version + commit + tag LOCALE.
# NON fa push (lo gestisce /trinity:release con conferma). Uso: mise run release 0.6.12
[tasks.release]
description = "Aggiorna version in .claude-plugin/plugin.json, fa il commit (chore(plugin): bump) e crea il tag vX.Y.Z locale. NON fa push. Uso: mise run release 0.6.12"
shell = "bash -c"
usage = 'arg "<version>" help="Nuova versione SemVer, es. 0.7.0"'
run = """
set -euo pipefail
V="${usage_version:?Uso: mise run release X.Y.Z}"
python - "$V" <<'PY'
import json, sys
p = ".claude-plugin/plugin.json"
d = json.load(open(p, encoding="utf-8"))
d["version"] = sys.argv[1]
with open(p, "w", encoding="utf-8", newline="\\n") as f:
    json.dump(d, f, ensure_ascii=False, indent=2)
    f.write("\\n")
PY
git add .claude-plugin/plugin.json
git commit -m "chore(plugin): bump $V"
git tag -a "v$V" -m "release v$V"
echo "OK: version=$V, commit e tag v$V creati (locali). Push con /trinity:release o: git push --follow-tags origin master"
"""