# mise.toml del plugin trinity — runtime del SERVIZIO Hindsight (server MCP :8888).
#
# Questo file NON è caricato automaticamente da Claude Code né da mise nei progetti:
# viene usato esplicitamente dagli hook del plugin via `mise -C <plugin_root> run <task>`
# (vedi hooks/hindsight/hindsight-ensure-up.sh). Hindsight è un singleton di macchina:
# l'env qui sotto serve SOLO al processo server al momento del lancio, i progetti
# parlano con il server già configurato via HTTP.
#
# La dashboard log (Roda/Puma), i benchmark (embed-bench/rerank-bench) e i check
# aggiornamenti (api-check/cp-check/cp-redirect-test, in scheduler/) sono stati migrati
# qui dal repo Trinity. I task relativi sono in fondo a questo file.

[tools]
python = "3.13"
# Node nativo Windows: serve per il Control Plane di Hindsight (app Next.js avviata
# via `npx @vectorize-io/hindsight-control-plane`). NB: l'npx del Node MSYS2 UCRT64
# (/ucrt64/bin) crasha (segfault/bad_weak_ptr) — questo Node mise lo rimpiazza.
node = "lts"
# Ruby per la dashboard log (Roda/Puma): `bundle install` e `puma` girano con questo
# Ruby gestito da mise, NON quello MSYS2 (le gem vanno installate con lo stesso Ruby
# che le esegue). L'hook reshim richiede `mise` nel PATH — garantito da _.path in [env].
ruby = "4.0.1"

[env]
# Espone gli entry-point script di hindsight-api (hindsight-local-mcp, hindsight-api, ecc.)
# La Scripts dir del Python mise non e' nel PATH per default sotto MSYS2.
_.path = [
  "C:/msys64/home/{{env.USERNAME}}/.local/share/mise/installs/python/3.13.13/Scripts",
]

# Forza Python a usare UTF-8 per stdin/stdout/stderr. Hindsight stampa un banner
# ANSI con caratteri Unicode che crasha sotto cp1252 (default Windows non-EN).
PYTHONUTF8 = "1"

# Verifica TLS via il CA bundle aziendale (lo stesso che usa curl), NON certifi.
# Il proxy ENINET fa MITM TLS intermittente con un certificato self-signed: certifi
# non ha la CA root aziendale → CERTIFICATE_VERIFY_FAILED intermittenti sulle chiamate
# httpx (embedding zembed-1 + reranker zerank-2). Questo bundle (Mozilla + CA aziendale)
# le fa verificare correttamente. NON è un downgrade: allinea Python al trust del SO.
SSL_CERT_FILE = "C:/certs/cacert.pem"
REQUESTS_CA_BUNDLE = "C:/certs/cacert.pem"
# Equivalente per Node/npm/npx (Control Plane): Node usa il proprio CA store, non quello
# del SO → stesso rischio MITM del proxy sui download npm.
NODE_EXTRA_CA_CERTS = "C:/certs/cacert.pem"

# Provider LLM per le operazioni retain/recall/reflect di hindsight.
HINDSIGHT_API_LLM_PROVIDER = "openai"
HINDSIGHT_API_LLM_MODEL = "gpt-4.1-mini"
# La chiave viene risolta a runtime dall'env utente (OPENAI_API_KEY), non hardcodata qui.
# Senza default: se manca la chiave il task abortisce subito — voluto, è il LLM di produzione.
HINDSIGHT_API_LLM_API_KEY = "{{env.OPENAI_API_KEY}}"
# Salta la chiamata di verifica LLM al boot (2026-06-12): avvio più rapido per
# hindsight-ensure-up.sh a inizio sessione, e niente hang se il proxy ENINET fa MITM.
# Contro accettato: una OPENAI_API_KEY errata emerge al primo retain, non al boot.
HINDSIGHT_API_SKIP_LLM_VERIFICATION = "true"

# --- LLM dedicato alla CONSOLIDATION (generazione delle observation) ---------
# A/B 3-vie del 2026-06-02 su seed reale (23 fatti, tag claude-code):
#   nano       → 0 observation: sul cold-start emette UPDATE su id inesistenti, mai CREATE
#   gpt-4.1-mini → 16 observation, con update incrementale corretto tra i batch
#   gpt-5-mini (reasoning, effort low) → 15 observation, qualità simile ma ~1.5-2x latenza
# Scelto gpt-4.1-mini. NB: la consolidation è server-level (no override per-bank);
# cambiarla richiede restart.
HINDSIGHT_API_CONSOLIDATION_LLM_PROVIDER = "openai"
HINDSIGHT_API_CONSOLIDATION_LLM_MODEL = "gpt-4.1-mini"
HINDSIGHT_API_CONSOLIDATION_LLM_API_KEY = "{{env.OPENAI_API_KEY}}"
HINDSIGHT_API_CONSOLIDATION_LLM_TIMEOUT = "180"

# PRODUZIONE: zembed-1 (ZeroEntropy) dal 2026-05-27. Per tornare a Gemini: rimetti "google"
# (richiede rebuild del bank). Le righe Gemini sotto restano come fallback documentato.
HINDSIGHT_API_EMBEDDINGS_PROVIDER = "zeroentropy"
# default(''): nel plugin la chiave Gemini è opzionale (fallback non attivo) — non deve
# abortire il lancio del server se manca nell'ambiente.
HINDSIGHT_API_EMBEDDINGS_GEMINI_API_KEY = "{{ env.GEMINI_API_KEY | default(value='') }}"
# NB: gemini-embedding-2 NON e' compatibile (l'API multimodale rende 1 embedding per
# N input → rompe il batching 1:1 di hindsight-api). Restare su 001.
HINDSIGHT_API_EMBEDDINGS_GEMINI_MODEL = "gemini-embedding-001"
HINDSIGHT_API_EMBEDDINGS_GEMINI_OUTPUT_DIMENSIONALITY = 1536

# Modelli locali multilingua (contenuti in italiano), usati solo se provider = local.
HINDSIGHT_API_EMBEDDINGS_LOCAL_MODEL = "BAAI/bge-m3"
HINDSIGHT_API_RERANKER_LOCAL_MODEL = "BAAI/bge-reranker-v2-m3"

# --- Lingua del canale lessicale BM25 (backend "native") --------------------
# I contenuti del bank sono in italiano: il dizionario tsvector di Postgres deve fare
# stemming/stopword italiane. Riguarda SOLO il canale BM25; il semantico è multilingua.
# ⚠️ Agisce solo sui NUOVI INSERT. Non impostiamo HINDSIGHT_API_LLM_OUTPUT_LANGUAGE:
# tradurrebbe i nomi entità e frammenterebbe il grafo (path, comandi, identificatori).
HINDSIGHT_API_TEXT_SEARCH_EXTENSION_NATIVE_LANGUAGE = "italian"

# --- Reranker ZeroEntropy (remoto, via API) ---------------------------------
# ATTIVATO il 2026-05-26 dopo benchmark: zerank-2 batte bge-reranker-v2-m3 su qualita'
# (R@1 0.73 vs 0.47) e latenza (3.4s vs 29.5s). Con provider != "local" la validazione
# config NON importa torch/transformers al boot (~20s in meno). Cambiare reranker NON
# richiede rebuild del bank (agisce a query-time).
HINDSIGHT_API_RERANKER_PROVIDER = "zeroentropy"
HINDSIGHT_API_RERANKER_ZEROENTROPY_API_KEY = "{{ env.ZEROENTROPY_API_KEY | default(value='') }}"
HINDSIGHT_API_RERANKER_ZEROENTROPY_MODEL = "zerank-2" # flagship; alt: zerank-2-small
# Gate del braccio semantico (default fabbrica 0.3). Alzato a 0.4 il 2026-06-12 dopo
# misura sul bank reale (8 query, trace 0.8.1): i risultati che vincono hanno similarity
# >= 0.47, il pool 0.33-0.45 non vince mai e consuma budget activation/fusione RRF.
# NON salire oltre 0.45: margine sul peggior finalista osservato (0.470) troppo sottile.
HINDSIGHT_API_SEMANTIC_MIN_SIMILARITY = "0.4"
# Timeout zerank-2 sotto il recall_timeout(10s) dell'hook (2026-06-12, default 60):
# se ZeroEntropy si appende, il rerank fallisce in fretta e il recall ripiega
# sull'ordine RRF dentro il budget dell'hook, invece di lavorare per nessuno.
HINDSIGHT_API_RERANKER_ZEROENTROPY_TIMEOUT = "8"
# Cap dei candidati passati al reranker per recall (2026-06-12, default 300): meno
# payload/latenza/costo verso zerank-2. VALIDATO col benchmark gold (18 query, k=3):
# top-3 identici rank per rank a 300; unico costo un fatto gold che era in posizione
# 17 e sparisce dalla coda (found_any 15→14/18). Rivalutare se recall_max_results >= 10.
HINDSIGHT_API_RERANKER_MAX_CANDIDATES = "100"

# --- Embedding zembed-1 ZeroEntropy (PRODUZIONE, nativo da hindsight-api 0.7.1) -------
# ⚠️ Cambiare provider IMPONE un REBUILD del bank: zembed-1 usa dim Matryoshka
#    [2560,1280,640,...], non 1536. Procedura: export (hindsight_export.py) → cambia
#    provider → riavvia → re-retain (hindsight_import.py). Tool in hooks/hindsight/tools/.
HINDSIGHT_API_EMBEDDINGS_ZEROENTROPY_API_KEY = "{{ env.ZEROENTROPY_API_KEY | default(value='') }}"
HINDSIGHT_API_EMBEDDINGS_ZEROENTROPY_MODEL = "zembed-1"
HINDSIGHT_API_EMBEDDINGS_ZEROENTROPY_DIMENSIONS = 1280 # Matryoshka: 2560/1280/640/320/160/80/40

# --- Audit log (2026-06-12) --------------------------------------------------
# Traccia ogni operazione (recall/retain/reflect/consolidation/…) nella tabella
# audit_log con duration_ms lato server, transport (http/mcp/system) e payload —
# copre TUTTI i client, anche quelli invisibili a hindsight-debug.log (tool MCP,
# promote script, Control Plane). Scrittura fire-and-forget (task asyncio fuori
# dal percorso richiesta): impatto performance trascurabile. Query: endpoint
# /audit-logs e /audit-logs/stats per bank.
HINDSIGHT_API_AUDIT_LOG_ENABLED = "true"
# Senza retention la tabella cresce per sempre (default -1): 30 giorni bastano
# per l'analisi dei timing; la pulizia la fa il MaintenanceLoop in background.
HINDSIGHT_API_AUDIT_LOG_RETENTION_DAYS = "30"

[tasks.install-hindsight]
description = "Installa/aggiorna hindsight-api (server Python locale, espone MCP) tramite pip del Python mise."
shell = "bash -c"
run = "python -m pip install --upgrade hindsight-api"

[tasks.start-hindsight]
description = "Avvia hindsight-local-mcp in background (porta 8888). Log in /tmp/hs.log."
# Mise su Windows usa cmd.exe per default — forziamo bash per via di `& disown` e `/tmp/`.
# --daemon non funziona su Windows (fork unavailable). setsid + nohup + disown:
#   - setsid: nuova sessione → child non riceve SIGHUP quando il terminale chiude
#   - nohup: extra sicurezza; < /dev/null: chiude stdin; & disown: fuori dal job control
# Senza setsid+nohup, su MSYS/Windows il child viene reaped quando il bash dell'hook esce.
shell = "bash -c"
run = "setsid nohup hindsight-local-mcp --port 8888 --log-level info > /tmp/hs.log 2>&1 < /dev/null & disown"

[tasks.stop-hindsight]
description = "Ferma il server hindsight-local-mcp (+ python figlio) e il Postgres embedded del bank"
# Forziamo bash: lo script usa taskkill //T (path assoluto) e pg_ctl.
# Path relativo: mise esegue il task con cwd = config_root (= root del plugin).
# {{config_root}} darebbe backslash Windows che la bash spezzerebbe.
shell = "bash -c"
run = "bash hooks/hindsight/ops/hindsight-stop-services.sh"

# --- Control Plane (Web UI Hindsight) --------------------------------------
[tasks.control-plane]
description = "Avvia il Control Plane (Web UI Hindsight) su http://localhost:9999, collegato all'API :8888. Foreground: Ctrl-C per fermarlo."
# HOSTNAME=localhost: Next.js eredita la env HOSTNAME (sotto MSYS2 = nome macchina) e
# vi si legherebbe; forzata a localhost per non esporre la UI in LAN (bind su ::1).
# VERSIONE 0.8.2 + workaround hostname (2026-06-12): il redirect-loop delle 0.7.0+
# non è un bug i18n in sé ma un origin-mismatch di Next standalone
# (vercel/next.js#91844): NextURL normalizza 127.0.0.1→localhost nel rewrite del
# middleware next-intl, mentre initUrl del router usa l'hostname di bind → il
# rewrite interno viene trattato come esterno → proxy su se stesso → loop 307.
# Bind su "localhost" fa combaciare gli origin. NON tornare a --hostname 127.0.0.1:
# il loop riappare (e con bind localhost l'URL http://127.0.0.1:9999 non risponde).
shell = "bash -c"
run = "HOSTNAME=localhost npx --yes @vectorize-io/hindsight-control-plane@0.8.3 --hostname localhost --api-url http://localhost:8888"

[tasks.stop-control-plane]
description = "Ferma il Control Plane (processo Node in ascolto su :9999)"
shell = "bash -c"
run = "bash hooks/hindsight/ops/kill-port.sh 9999 control-plane"

# --- Dashboard log (Roda/Puma) ---------------------------------------------
# Web app Ruby per analizzare hindsight-debug.log (JSONL): tail SSE realtime,
# color-coding, filtri, vista memories[]. Gira sul Ruby mise (4.0.1), non MSYS2.
# Il default del log in app.rb è portabile (<plugin_root>/logs/hindsight-debug.log),
# coerente con lib/hindsight_debug.py — quindi il task non passa LOG_FILE.
[tasks.install-dashboard]
description = "Installa le gem della dashboard log (bundle install) sotto il Ruby mise (4.0.1). Eseguire una tantum prima di `dashboard`."
shell = "bash -c"
run = "cd hooks/hindsight/hindsight-dashboard && bundle install"

[tasks.dashboard]
description = "Avvia la dashboard log Hindsight (Roda/Puma) su http://localhost:9292. Foreground: Ctrl-C per fermarla. Richiede prima `mise run install-dashboard`."
shell = "bash -c"
run = "cd hooks/hindsight/hindsight-dashboard && bundle exec puma -p 9292"

[tasks.stop-dashboard]
description = "Ferma la dashboard log (processo Puma in ascolto su :9292)"
shell = "bash -c"
run = "bash hooks/hindsight/ops/kill-port.sh 9292 dashboard"

# --- Benchmark qualità (embedding / reranker) ------------------------------
# Ereditano l'[env] del plugin (provider + chiavi) → girano con la config di produzione.
# Script rilocabili (corpora via __dir__/__file__). hindsight_bench.rb (bench LLM provider)
# e hindsight_recall_quality_bench.py restano lanciabili a mano da hooks/hindsight/benchmark/.
[tasks.embed-bench]
description = "Confronta gli embedding (zembed-1 vs Gemini vs bge-m3 locale) a livello vettoriale puro su corpus sintetico IT/EN (MRR, recall@k). NON tocca il bank né Postgres. Foreground (~minuti, scarica bge-m3 al primo run)."
shell = "bash -c"
run = "python hooks/hindsight/benchmark/hindsight_embed_bench.py"

[tasks.rerank-bench]
description = "Confronta i reranker su corpus rank-aware (MRR, recall@k). Ferma/riavvia il server :8888 più volte e lo ripristina alla fine (~5-10 min). Eredita l'[env] di produzione."
shell = "bash -c"
run = "ruby hooks/hindsight/benchmark/hindsight_rerank_bench.rb"

# --- Check aggiornamenti (scheduler) ---------------------------------------
# Lanciabili a mano o da System Scheduler (Splinterware) via scheduler/*/*-scheduled.cmd
# (i job vanno registrati con i path di questo repo — vedi i README in scheduler/).
# cp-check.rb / cp-redirect-test.sh trovano la root del repo via TRINITY_PLUGIN_DIR
# (env utente) con fallback relativo: scheduler/check_update_*/ -> ../..
[tasks.api-check]
description = "Controlla se su PyPI è uscita una versione di hindsight-api/hindsight-api-slim più recente di quella installata. Exit 10 se sì."
shell = "bash -c"
run = "ruby scheduler/check_update_hindsight_api/api-check.rb"

[tasks.cp-check]
description = "Controlla se è uscita una versione del Control Plane più recente di quella pinnata nel mise.toml. Exit 10 se sì."
shell = "bash -c"
run = "ruby scheduler/check_update_hindsight_control_plane/cp-check.rb"

[tasks.cp-redirect-test]
description = "Testa se una versione del Control Plane ha ancora il bug del redirect-loop. Uso: VERSION=0.7.1 mise run cp-redirect-test (porta usa-e-getta 9998)."
shell = "bash -c"
run = "bash scheduler/check_update_hindsight_control_plane/cp-redirect-test.sh \"${VERSION:?imposta VERSION=X.Y.Z}\" \"${PORT:-9998}\""

# --- Excalidraw Canvas (frontend MCP) -------------------------------------
[tasks.start-excalidraw]
description = "Avvia il frontend canvas Excalidraw (porta 3000). Log in logs/excalidraw-server.log."
shell = "bash -c"
run = "setsid nohup node C:/msys64/home/EN27553/.local/opt/mcp_excalidraw/dist/server.js > /tmp/excalidraw-server.log 2>&1 < /dev/null & disown"

[tasks.stop-excalidraw]
description = "Ferma il frontend canvas Excalidraw (porta 3000), solo se il server su :3000 è effettivamente Excalidraw."
shell = "bash -c"
run = "ruby script/stop-excalidraw.rb"

[tasks.promote-scan]
description = "Scan + triage LLM dei bank Hindsight di progetto: candidati alla promozione sul core in logs/promote-candidates.json. NON promuove (review umana via /trinity:promote)."
shell = "bash -c"
run = "python hooks/hindsight/ops/hindsight-promote.py --triage"

# --- Git hooks -------------------------------------------------------------
# Attiva gli hook versionati in .githooks/ (non tracciati in .git/hooks/).
# Da rilanciare una volta per ogni clone nuovo del repo.
[tasks.install-git-hooks]
description = "Configura git per usare .githooks/ (post-commit/post-merge: ridistribuiscono la callback LiteLLM se script/litellm-callbacks.py cambia)."
shell = "bash -c"
run = "git config core.hooksPath .githooks && echo 'core.hooksPath = .githooks'"
