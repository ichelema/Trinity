<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hindsight Log Dashboard</title>
  <link rel="stylesheet" href="/assets/app.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Hindsight Log Dashboard</h1>
      <p class="subtitle">JSONL tail + analisi eventi + dettaglio memories</p>
    </div>
    <div class="status-pill" id="streamStatus">offline</div>
  </header>

  <main>
    <section class="panel controls">
      <div class="control-row">
        <label class="grow">
          <span>Log file</span>
          <input id="pathInput" type="text" spellcheck="false" placeholder="D:/AI/Claude/Trinity/logs/hindsight-debug.log" />
        </label>
        <button id="openBtn">Apri</button>
        <button id="reloadBtn">Ricarica</button>
      </div>

      <div class="control-row compact">
        <label>
          <span>Eventi</span>
          <input id="eventsInput" type="text" spellcheck="false" placeholder="recall,recall_error,retain" />
        </label>
        <label>
          <span>Grep</span>
          <input id="grepInput" type="text" spellcheck="false" placeholder="timeout, prompt, bank..." />
        </label>
        <label>
          <span>Righe iniziali</span>
          <input id="limitInput" type="number" min="1" max="5000" value="500" />
        </label>
        <button id="applyBtn">Applica filtri</button>
        <button id="clearBtn" class="ghost">Pulisci tabella</button>
      </div>

      <div class="chips" id="quickFilters">
        <button data-events="">tutti</button>
        <button data-events="recall,recall_error,recall_skip">recall*</button>
        <button data-events="retain,retain_result,retain_skip">retain*</button>
        <button data-events="recall_error">errori recall</button>
        <button data-events="recall_error,recall_skip,retain_skip,parse_error">problemi</button>
      </div>
    </section>

    <section class="metrics" id="metrics"></section>

    <section class="panel table-panel">
      <div class="table-head">
        <div>
          <h2>Eventi</h2>
          <p id="tableInfo">Nessun log caricato.</p>
        </div>
        <div class="table-actions">
          <label class="checkbox">
            <input id="newestFirst" type="checkbox" checked />
            <span>ultimi in alto</span>
          </label>
          <label class="checkbox">
            <input id="autoScroll" type="checkbox" checked />
            <span>autoscroll</span>
          </label>
        </div>
      </div>

      <div class="table-wrap" id="tableWrap">
        <table>
          <thead>
            <tr>
              <th>Time</th>
              <th>Level</th>
              <th>Event</th>
              <th>Status</th>
              <th>Cache</th>
              <th>N</th>
              <th>Mem</th>
              <th>Doc</th>
              <th>Message</th>
            </tr>
          </thead>
          <tbody id="logBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <dialog id="detailDialog">
    <div class="modal-head">
      <div>
        <h2 id="detailTitle">Dettaglio evento</h2>
        <p id="detailSubtitle"></p>
      </div>
      <button id="closeDialog" class="ghost">Chiudi</button>
    </div>
    <div id="detailBody" class="detail-body"></div>
  </dialog>

  <script src="/assets/app.js"></script>
</body>
</html>
